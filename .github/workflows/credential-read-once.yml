name: One-shot credential reads

on:
    push:
        branches: [ci/credential-read-once-38638219079]

permissions: {}
concurrency:
    group: kbpod-credential-read-once
    cancel-in-progress: false

jobs:
    probe:
        if: >-
            github.repository == 'nartc/kbpod' &&
            github.ref == 'refs/heads/ci/credential-read-once-38638219079' &&
            github.event.created == true && github.event.deleted == false &&
            github.event.forced == false && github.run_attempt == '1' &&
            github.actor == 'nartc' && github.triggering_actor == 'nartc'
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        steps:
            - name: Read only the three approved capabilities
              shell: bash
              env:
                  PROBE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: |
                  set +x
                  ulimit -c 0
                  timeout --signal=TERM --kill-after=2s 70s python3 -I - 2>/dev/null <<'PY'
                  import http.client
                  import json
                  import os
                  import signal
                  import ssl
                  import sys

                  LIMIT = 65536
                  CHECKS = (
                      ("verify", "/client/v4/user/tokens/verify", "active"),
                      ("subdomain", "/client/v4/accounts/7cae6ad8270c12d5328aebe85fc0528a/workers/subdomain", "present"),
                      ("stores", "/client/v4/accounts/7cae6ad8270c12d5328aebe85fc0528a/secrets_store/stores?per_page=1", "present"),
                  )
                  BOOL_KEYS = frozenset((
                      "token_present", "verify_valid", "verify_active",
                      "subdomain_valid", "subdomain_present", "stores_valid",
                      "stores_present", "diagnostic_complete",
                  ))
                  HTTP_KEYS = frozenset(("verify_http", "subdomain_http", "stores_http"))

                  def safe_line(key, value):
                      if key in BOOL_KEYS and type(value) is bool:
                          return key + "=" + ("true" if value else "false") + "\n"
                      if key in HTTP_KEYS and type(value) is int and (value == 0 or 100 <= value <= 599):
                          return key + "=" + str(value) + "\n"
                      raise ValueError()

                  def unique_object(pairs):
                      result = {}
                      for key, value in pairs:
                          if key in result:
                              raise ValueError()
                          result[key] = value
                      return result

                  def reject_constant(_value):
                      raise ValueError()

                  def project(kind, status, body):
                      if status != 200 or type(body) is not bytes or len(body) > LIMIT:
                          return False, False
                      try:
                          envelope = json.loads(
                              body.decode("utf-8"), object_pairs_hook=unique_object,
                              parse_constant=reject_constant,
                          )
                          if type(envelope) is not dict or envelope.get("success") is not True:
                              return False, False
                          result = envelope.get("result")
                          if kind == "verify" and type(result) is dict:
                              state = result.get("status")
                              if type(state) is str and state in ("active", "disabled", "expired"):
                                  return True, state == "active"
                          if kind == "subdomain" and type(result) is dict:
                              subdomain = result.get("subdomain")
                              if type(subdomain) is str:
                                  return True, bool(subdomain.strip())
                          if kind == "stores" and type(result) is list and all(type(item) is dict for item in result):
                              return True, bool(result)
                      except BaseException:
                          pass
                      return False, False

                  def run_probe(token, request, emit):
                      present = type(token) is str and bool(token.strip())
                      emit("token_present", present)
                      if not present:
                          emit("diagnostic_complete", False)
                          return False
                      for kind, path, field in CHECKS:
                          try:
                              status, body = request(path, token)
                          except BaseException:
                              status, body = 0, None
                          if type(status) is not int or not 100 <= status <= 599:
                              status = 0
                          valid, positive = project(kind, status, body)
                          emit(kind + "_http", status)
                          emit(kind + "_valid", valid)
                          emit(kind + "_" + field, positive)
                          if not valid or not positive:
                              emit("diagnostic_complete", False)
                              return False
                      emit("diagnostic_complete", True)
                      return True

                  def request_once(path, token):
                      status = 0
                      connection = None
                      try:
                          # Default SIGALRM terminates even during a blocked native DNS call.
                          # A hard deadline leaves incomplete evidence, never a successful report.
                          signal.setitimer(signal.ITIMER_REAL, 20)
                          connection = http.client.HTTPSConnection(
                              "api.cloudflare.com", 443, timeout=20,
                              context=ssl.create_default_context(),
                          )
                          # http.client does not follow redirects, use proxies or retry.
                          connection.request("GET", path, headers={
                              "Authorization": "Bearer " + token,
                              "Accept": "application/json",
                          })
                          response = connection.getresponse()
                          status = response.status
                          if status != 200:
                              return status, None
                          return status, response.read(LIMIT + 1)
                      except BaseException:
                          return status, None
                      finally:
                          signal.setitimer(signal.ITIMER_REAL, 0)
                          if connection is not None:
                              connection.close()

                  def main():
                      summary = None
                      try:
                          signal.signal(signal.SIGALRM, signal.SIG_DFL)
                          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="ascii")
                          def emit(key, value):
                              line = safe_line(key, value)
                              summary.write(line)
                              summary.flush()
                              sys.stdout.write(line)
                              sys.stdout.flush()
                          return 0 if run_probe(os.environ.get("PROBE_TOKEN"), request_once, emit) else 1
                      except BaseException:
                          # No exception text, response, token or nested cause is serialized.
                          line = safe_line("diagnostic_complete", False)
                          for sink in (summary, sys.stdout):
                              try:
                                  if sink is not None:
                                      sink.write(line)
                                      sink.flush()
                              except BaseException:
                                  pass
                          return 1
                      finally:
                          if summary is not None:
                              try:
                                  summary.close()
                              except BaseException:
                                  pass

                  if __name__ == "__main__":
                      sys.exit(main())
                  PY
